<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Day 16 — MCP → m365-mail</title>
  <style>
    :root {
      --ink: #1a1a1a; --muted: #5c5c5c; --line: #d6d2cb; --accent: #1f4d3a;
      --surface: #fffdf9; --warn: #8b1e1e; --ok: #1f4d3a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      color: var(--ink); background: linear-gradient(160deg, #f6f4f0, #efeae2);
    }
    main { max-width: 820px; margin: 0 auto; padding: 1.5rem 1.1rem 2.5rem; }
    h1 { margin: 0 0 0.35rem; font-size: 1.4rem; font-weight: 600; }
    .sub { margin: 0 0 1.1rem; color: var(--muted); font-size: 0.9rem; line-height: 1.45; }
    .panel {
      border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
      padding: 0.9rem; margin-bottom: 0.9rem;
    }
    button {
      appearance: none; border: 0; border-radius: 6px; background: var(--accent);
      color: #f7f7f5; font: inherit; font-weight: 500; padding: 0.5rem 0.9rem; cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button:hover:not(:disabled) { filter: brightness(1.05); }
    #status { margin-top: 0.65rem; font-size: 0.88rem; color: var(--muted); white-space: pre-wrap; }
    #status.ok { color: var(--ok); }
    #status.err { color: var(--warn); }
    table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
    th, td { text-align: left; padding: 0.45rem 0.4rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; }
    code { font-size: 0.8rem; }
    .meta { font-size: 0.78rem; color: var(--muted); margin-bottom: 0.55rem; }
  </style>
</head>
<body>
  <main>
    <h1>Day 16 — MCP client → m365-mail</h1>
    <p class="sub">
      Поднимает локальный MCP-сервер почты по stdio, устанавливает соединение и запрашивает
      <code>tools/list</code>. Graph login для списка tools не нужен.
    </p>

    <div class="panel">
      <button type="button" id="btn">Подключить и получить tools</button>
      <div id="status">Нажмите кнопку, чтобы установить MCP-соединение.</div>
    </div>

    <div class="panel" id="result-panel" style="display:none">
      <div class="meta" id="meta"></div>
      <table>
        <thead>
          <tr><th>#</th><th>Name</th><th>Description</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const btn = $("btn");
    const status = $("status");

    btn.onclick = async () => {
      btn.disabled = true;
      status.className = "";
      status.textContent = "Подключаюсь к m365-mail…";
      $("result-panel").style.display = "none";
      try {
        const res = await fetch("/api/tools", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || res.statusText);
        status.className = "ok";
        status.textContent = "OK connected — tools: " + data.count;
        $("meta").textContent = "Server: " + data.server.command + " " + (data.server.args || []).join(" ");
        const tb = $("tbody");
        tb.innerHTML = "";
        (data.tools || []).forEach((t, i) => {
          const tr = document.createElement("tr");
          tr.innerHTML =
            "<td>" + (i + 1) + "</td>" +
            "<td><code>" + esc(t.name) + "</code></td>" +
            "<td>" + esc(t.description || "") + "</td>";
          tb.appendChild(tr);
        });
        $("result-panel").style.display = "block";
      } catch (e) {
        status.className = "err";
        status.textContent = "FAILED: " + (e.message || e);
      } finally {
        btn.disabled = false;
      }
    };

    function esc(s) {
      return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }
  </script>
</body>
</html>
