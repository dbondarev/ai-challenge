<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Day 13 — задачи и этапы</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <style>
    :root {
      --ink: #1a1a1a; --muted: #5c5c5c; --line: #d6d2cb; --accent: #1f4d3a;
      --accent-hover: #16392b; --surface: #fffdf9; --user-bg: #e8ebe4; --warn: #8b1e1e;
      --pause: #6b4a2e; --side: #f3efe7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: "IBM Plex Sans", "Segoe UI", sans-serif; color: var(--ink);
      background: linear-gradient(160deg, #f6f4f0, #efeae2);
    }
    .shell {
      display: grid; grid-template-columns: 1fr 280px; gap: 0;
      max-width: 1100px; margin: 0 auto; min-height: 100vh;
    }
    @media (max-width: 860px) { .shell { grid-template-columns: 1fr; } }
    main { padding: 1.25rem 1.1rem 2.5rem; }
    aside.tasks {
      background: var(--side); border-left: 1px solid var(--line);
      padding: 1.1rem 0.85rem; overflow-y: auto;
    }
    h1 { margin: 0 0 0.25rem; font-size: 1.35rem; font-weight: 600; }
    .sub { margin: 0 0 1rem; color: var(--muted); font-size: 0.88rem; line-height: 1.4; }
    .panel {
      border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
      padding: 0.85rem; margin-bottom: 0.85rem;
    }
    .panel.paused { border-color: var(--pause); }
    .panel h2 { margin: 0 0 0.4rem; font-size: 0.95rem; }
    label { display: block; margin-bottom: 0.2rem; font-size: 0.74rem; color: var(--muted); }
    textarea, select {
      width: 100%; border: 1px solid var(--line); border-radius: 6px;
      background: #fff; color: var(--ink); font: inherit; padding: 0.5rem 0.6rem;
    }
    textarea { resize: vertical; min-height: 4.5rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.5rem; }
    button {
      appearance: none; border: 0; border-radius: 6px; background: var(--accent);
      color: #f7f7f5; font: inherit; font-weight: 500; padding: 0.45rem 0.75rem; cursor: pointer;
    }
    button.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
    button.pause { background: var(--pause); }
    button:hover:not(:disabled) { filter: brightness(1.05); }
    button.secondary:hover:not(:disabled) { background: var(--user-bg); filter: none; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .stages { display: flex; flex-wrap: wrap; gap: 0.3rem; margin: 0.45rem 0; }
    .stage-pill {
      border: 1px solid var(--line); border-radius: 999px; padding: 0.2rem 0.55rem;
      font-size: 0.72rem; background: #f7f3ec; color: var(--ink);
    }
    .stage-pill.current { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
    .meta { font-size: 0.82rem; color: var(--muted); margin: 0.25rem 0 0.5rem; line-height: 1.4; }
    .badge {
      display: inline-block; font-size: 0.68rem; font-weight: 600; text-transform: uppercase;
      padding: 0.12rem 0.4rem; border-radius: 4px; background: #ebe6dc; color: var(--muted);
    }
    .badge.on { background: var(--pause); color: #fff; }
    #thread {
      display: flex; flex-direction: column; gap: 0.5rem; max-height: 42vh; overflow: auto;
      margin: 0.5rem 0;
    }
    .bubble {
      padding: 0.55rem 0.7rem; border-radius: 8px; border: 1px solid var(--line);
      background: var(--surface); line-height: 1.45; font-size: 0.88rem;
    }
    .bubble.user { background: var(--user-bg); }
    .bubble .who {
      margin: 0 0 0.15rem; font-size: 0.65rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted);
    }
    .bubble.md p { margin: 0.3rem 0; }
    #global-error { color: var(--warn); font-size: 0.86rem; white-space: pre-wrap; margin-top: 0.4rem; }
    .empty { color: var(--muted); font-size: 0.85rem; }
    aside.tasks h2 { margin: 0 0 0.55rem; font-size: 0.9rem; }
    .task-item {
      display: block; width: 100%; text-align: left; margin-bottom: 0.4rem;
      padding: 0.55rem 0.6rem; border-radius: 8px; border: 1px solid var(--line);
      background: #fff; color: var(--ink); cursor: pointer; font-weight: 400;
    }
    .task-item:hover { background: #faf7f1; }
    .task-item.active { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
    .task-item .t-title { font-weight: 600; font-size: 0.86rem; margin-bottom: 0.2rem; }
    .task-item .t-meta { font-size: 0.72rem; color: var(--muted); }
    .task-item .t-meta .paused-tag { color: var(--pause); font-weight: 600; }
    details.payload { margin-top: 0.5rem; font-size: 0.75rem; color: var(--muted); }
    details.payload pre {
      margin: 0.3rem 0 0; max-height: 12rem; overflow: auto; background: #1f2421; color: #e8ebe6;
      padding: 0.45rem 0.55rem; border-radius: 6px; white-space: pre-wrap; font-size: 0.68rem;
    }
  </style>
</head>
<body>
  <div class="shell">
    <main>
      <h1>Day 13 — задачи и этапы</h1>
      <p class="sub">Новая задача → агент ведёт по этапам с подтверждением. Пауза / комментарий / следующий этап. Список справа сохраняется при обновлении.</p>

      <div class="panel" id="create-panel">
        <h2>Новая задача</h2>
        <label for="new-task-text">Описание задачи</label>
        <textarea id="new-task-text" placeholder="Что нужно сделать? Цель, ограничения, контекст…"></textarea>
        <div class="actions">
          <button type="button" id="btn-new-task">Новая задача</button>
        </div>
      </div>

      <div class="panel" id="active-panel">
        <h2 id="task-title">Нет активной задачи</h2>
        <div class="meta" id="task-meta"></div>
        <div class="stages" id="stages"></div>
        <div id="thread"></div>
        <div class="actions" id="stage-actions"></div>
        <label for="comment">Комментарий к текущему этапу</label>
        <textarea id="comment" placeholder="Уточнение, правки, ответ на вопрос агента…"></textarea>
        <div class="actions">
          <button type="button" id="btn-comment">Отправить комментарий</button>
          <button type="button" class="secondary" id="btn-delete-task">Удалить задачу</button>
        </div>
        <div id="global-error"></div>
        <details class="payload">
          <summary>Last API messages</summary>
          <pre id="payload">—</pre>
        </details>
      </div>
    </main>

    <aside class="tasks">
      <h2>Задачи</h2>
      <div id="task-list" class="empty">Пока пусто</div>
    </aside>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let state = null;
    let busy = false;

    function showError(m) { $("global-error").textContent = m || ""; }
    function md(t) {
      try { return marked.parse(t || ""); }
      catch { return String(t || "").replace(/</g, "&lt;"); }
    }
    function esc(s) {
      return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    async function api(path, body) {
      const isGet = arguments.length < 2;
      const res = await fetch(path, {
        method: isGet ? "GET" : "POST",
        headers: isGet ? undefined : { "Content-Type": "application/json" },
        body: isGet ? undefined : JSON.stringify(body == null ? {} : body),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    }

    function renderThread(messages) {
      const box = $("thread");
      box.innerHTML = "";
      if (!messages || !messages.length) {
        box.innerHTML = '<p class="empty">Диалог по задаче пуст.</p>';
        return;
      }
      for (const m of messages) {
        const div = document.createElement("div");
        div.className = "bubble " + (m.role === "user" ? "user" : "md");
        const who = m.role === "user" ? "Вы" : "Агент";
        const body = m.role === "assistant" ? md(m.content) : esc(m.content);
        div.innerHTML = '<div class="who">' + who + '</div>' + body;
        box.appendChild(div);
      }
      box.scrollTop = box.scrollHeight;
    }

    function renderStages(task) {
      const box = $("stages");
      box.innerHTML = "";
      if (!task) return;
      const labels = task.stage_labels || {};
      for (const s of (task.stages || [])) {
        if (s === "idle") continue;
        const pill = document.createElement("span");
        pill.className = "stage-pill" + (s === task.stage ? " current" : "");
        pill.textContent = labels[s] || s;
        box.appendChild(pill);
      }
    }

    function renderActions(task) {
      const box = $("stage-actions");
      box.innerHTML = "";
      if (!task) return;

      if (task.can_advance && task.forward_stage) {
        const b = document.createElement("button");
        b.type = "button";
        const label = (task.stage_labels && task.stage_labels[task.forward_stage]) || task.forward_stage;
        b.textContent = "→ " + label;
        b.onclick = () => run(() => api("/api/task/advance", {}));
        box.appendChild(b);
      }

      // rework / other allowed (except idle and forward already shown)
      for (const s of (task.allowed_transitions || [])) {
        if (s === "idle" || s === task.forward_stage) continue;
        const b = document.createElement("button");
        b.type = "button";
        b.className = "secondary";
        const label = (task.stage_labels && task.stage_labels[s]) || s;
        b.textContent = "→ " + label;
        b.disabled = !!task.paused;
        b.onclick = () => run(() => api("/api/task/transition", { stage: s }));
        box.appendChild(b);
      }

      if (task.can_pause) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "pause";
        b.textContent = "Пауза";
        b.onclick = () => {
          const reason = prompt("Причина паузы (необязательно)", "") || "";
          run(() => api("/api/task/pause", { reason }));
        };
        box.appendChild(b);
      }
      if (task.can_resume) {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = "Продолжить";
        b.onclick = () => run(() => api("/api/task/resume", {}));
        box.appendChild(b);
      }
    }

    function renderTaskList(tasks) {
      const box = $("task-list");
      box.innerHTML = "";
      if (!tasks || !tasks.length) {
        box.className = "empty";
        box.textContent = "Пока пусто";
        return;
      }
      box.className = "";
      for (const t of tasks) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "task-item" + (t.active ? " active" : "");
        b.innerHTML =
          '<div class="t-title">' + esc(t.title) + '</div>' +
          '<div class="t-meta">' + esc(t.stage_label || t.stage) +
          (t.paused ? ' · <span class="paused-tag">пауза</span>' : "") +
          "</div>";
        b.onclick = () => {
          if (t.active) return;
          run(() => api("/api/task/select", { task_id: t.task_id }));
        };
        box.appendChild(b);
      }
    }

    function applyState(s) {
      state = s;
      if (!s) return;
      renderTaskList(s.tasks || []);
      const task = s.task;
      const panel = $("active-panel");
      if (!task) {
        $("task-title").textContent = "Нет активной задачи";
        $("task-meta").textContent = "Создайте задачу слева сверху.";
        $("stages").innerHTML = "";
        $("stage-actions").innerHTML = "";
        renderThread([]);
        panel.classList.remove("paused");
        $("payload").textContent = "—";
        return;
      }
      $("task-title").textContent = task.title || task.task_id;
      const badge = task.paused
        ? '<span class="badge on">пауза</span> ' + esc(task.pause_reason || "")
        : '<span class="badge">активна</span>';
      $("task-meta").innerHTML =
        badge + " · этап: <strong>" + esc(task.stage_label || task.stage) +
        "</strong> · step: " + esc(task.step);
      panel.classList.toggle("paused", !!task.paused);
      renderStages(task);
      renderActions(task);
      renderThread(s.messages || task.messages || []);
      $("payload").textContent = JSON.stringify(s.last_api_messages || [], null, 2);
    }

    async function run(fn) {
      if (busy) return;
      busy = true;
      showError("");
      try {
        const data = await fn();
        applyState(data.state || data);
      } catch (e) {
        showError(String(e.message || e));
      } finally {
        busy = false;
      }
    }

    $("btn-new-task").onclick = () => {
      const text = $("new-task-text").value.trim();
      if (!text) { showError("Введите текст задачи"); return; }
      run(async () => {
        const data = await api("/api/task/create", { text });
        $("new-task-text").value = "";
        return data;
      });
    };

    $("btn-comment").onclick = () => {
      const text = $("comment").value.trim();
      if (!text) return;
      run(async () => {
        const data = await api("/api/task/comment", { text });
        $("comment").value = "";
        return data;
      });
    };

    $("comment").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        $("btn-comment").click();
      }
    });

    $("btn-delete-task").onclick = () => {
      if (!state || !state.active_task_id) return;
      if (!confirm("Удалить активную задачу?")) return;
      run(() => api("/api/task/delete", { task_id: state.active_task_id }).then((d) => d.state || d));
    };

    api("/api/history").then(applyState).catch((e) => showError(String(e)));
  </script>
</body>
</html>
